konarm_velocity_controller:
  ros__parameters:
    joints:
      - Rev1
      - Rev2
      - Rev3
      - Rev4
      - Rev5
      - Rev6

    command_interfaces:
      - velocity
    joint_limits:
      Rev1: {has_velocity_limits: true, max_velocity: 0.5}
      Rev2: {has_velocity_limits: true, max_velocity: 0.5}
      Rev3: {has_velocity_limits: true, max_velocity: 0.5}
      Rev4: {has_velocity_limits: true, max_velocity: 0.5}
      Rev5: {has_velocity_limits: true, max_velocity: 0.5}
      Rev6: {has_velocity_limits: true, max_velocity: 0.5}
